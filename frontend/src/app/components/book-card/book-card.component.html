<div class="glass-panel rounded-xl overflow-hidden transition-all duration-300 hover:-translate-y-1 group relative">
  <!-- Glowing accent border at top -->
  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-dracula-cyan to-dracula-purple scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></div>
  
  <div class="p-6">
    <div class="flex justify-between items-start mb-4">
      <h3 class="font-bold text-xl text-dracula-fg group-hover:text-dracula-pink transition-colors">{{ book.title }}</h3>
      <span class="px-2 py-1 text-xs font-semibold rounded-md border" 
            [ngClass]="book.is_issued ? 'bg-dracula-red/20 text-dracula-red border-dracula-red/30' : 'bg-dracula-green/20 text-dracula-green border-dracula-green/30'">
        {{ book.is_issued ? 'Issued' : 'Available' }}
      </span>
    </div>
    
    <p class="text-dracula-comment text-sm mb-2">by <span class="text-dracula-fg opacity-80">{{ book.author }}</span></p>
    <p class="text-dracula-cyan text-xs inline-block bg-dracula-cyan/10 px-2 py-1 rounded mb-4">{{ book.category }}</p>

    <!-- Issued information details (only visible if admin or if current user holds it) -->
    <div *ngIf="book.is_issued" class="mt-2 text-xs bg-dracula-cur/50 p-2 rounded-lg border border-dracula-cur text-dracula-fg">
      <p *ngIf="role === 'admin'">Issued to: <span class="font-semibold text-dracula-orange">{{ book.issued_to }}</span></p>
      <p *ngIf="role === 'admin'">Date: {{ book.issued_date | date }}</p>
      <p class="text-dracula-pink font-semibold mt-1">Expected Return: {{ book.expected_return_date | date }}</p>
    </div>

    <!-- User Action Button -->
    <div class="mt-4 pt-4 border-t border-dracula-cur/50 flex justify-between gap-2">
      <button *ngIf="role === 'user' && !book.is_issued" (click)="onRequestBook()"
              class="flex-1 bg-dracula-purple/20 hover:bg-dracula-purple text-dracula-purple hover:text-dracula-bg border border-dracula-purple transition-colors font-medium rounded-lg py-2 text-sm shadow-sm group">
        <span class="group-active:scale-95 inline-block transition-transform">Request Book</span>
      </button>

      <button *ngIf="role === 'admin' && !book.is_issued" (click)="onIssueBook()"
              class="flex-1 bg-dracula-pink/20 hover:bg-dracula-pink text-dracula-pink hover:text-dracula-bg border border-dracula-pink transition-colors font-medium rounded-lg py-2 text-sm shadow-sm group">
        <span class="group-active:scale-95 inline-block transition-transform">Issue Book</span>
      </button>

      <button *ngIf="role === 'admin'" (click)="onViewQr()"
              class="w-full bg-dracula-cyan/10 hover:bg-dracula-cyan text-dracula-cyan hover:text-dracula-bg border border-dracula-cyan transition-colors font-medium rounded-lg py-2 text-sm shadow-sm opacity-90 hover:opacity-100 flex items-center justify-center gap-2 relative overflow-hidden group">
         <span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
         <span class="relative z-10 flex items-center gap-1 group-active:scale-95 transition-transform"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg> View QR</span>
      </button>
    </div>
  </div>
</div>
