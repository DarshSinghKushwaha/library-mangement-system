<div class="glass-panel rounded-[12px] overflow-hidden transition-all duration-300 hover:-translate-y-1 group relative h-full flex flex-col w-full bg-bg border border-cur shadow-sm">
  <!-- Glowing accent border at top -->
  <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary scale-x-0 group-hover:scale-x-100 transition-transform duration-500 origin-left"></div>
  
  <div class="p-4 flex flex-col flex-grow">
    <div class="flex justify-between items-start mb-3">
      <h3 class="font-bold text-[1.15rem] leading-tight text-fg group-hover:text-primary transition-colors">{{ book.title }}</h3>
      <span class="px-2 py-1 text-[10px] font-bold rounded-md flex-shrink-0 ml-2 shadow-sm"
            [ngClass]="book.is_issued ? 'bg-cur text-fg border border-comment' : 'bg-success text-white'">
        {{ book.is_issued ? 'Issued' : 'Available' }}
      </span>
    </div>
    
    <p class="text-comment text-xs mb-1">by <span class="text-fg opacity-80">{{ book.author }}</span></p>
    <p class="text-primary text-[10px] uppercase tracking-wider font-bold mb-3">{{ book.category }}</p>

    <!-- Issued information details (only visible if admin or if current user holds it) -->
    <div *ngIf="book.is_issued" class="mt-2 text-xs bg-cur/50 p-2 rounded-[10px] border border-cur text-fg">
      <p *ngIf="role === 'admin'">Issued to: <span class="font-semibold text-warning">{{ book.issued_to }}</span></p>
      <p *ngIf="role === 'admin'">Date: {{ book.issued_date | date }}</p>
      <p class="text-secondary font-semibold mt-1">Expected Return: {{ book.expected_return_date | date }}</p>
    </div>

    <!-- User Action Buttons - pushed to bottom -->
    <div class="mt-auto pt-4 border-t border-cur/50 flex gap-2">
      <button *ngIf="role === 'user' && !book.is_issued" (click)="onRequestBook()"
              class="flex-1 bg-primary text-white hover:bg-secondary transition-all font-bold rounded-[10px] py-2 text-sm shadow-md active:scale-95">
        Request Book
      </button>

      <button *ngIf="role === 'admin' && !book.is_issued" (click)="onIssueBook()"
              class="flex-1 bg-secondary text-white hover:bg-primary transition-all font-bold rounded-[10px] py-2 text-sm shadow-md active:scale-95">
        Issue Book
      </button>

      <button *ngIf="role === 'admin'" (click)="onViewQr()"
              class="flex-1 bg-primary/10 hover:bg-primary text-primary hover:text-white border border-primary transition-colors font-medium rounded-[10px] py-2 text-sm shadow-sm opacity-90 hover:opacity-100 flex items-center justify-center gap-2 relative overflow-hidden group">
         <span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
         <span class="relative z-10 flex items-center gap-1 transition-transform active:scale-95"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg> View QR</span>
      </button>
    </div>
  </div>
</div>
